✳每日福音书分享-马可福音

《馬可福音1》
1神的儿子，耶稣基督福音的起头。

2正如先知以赛亚（有古卷无以赛亚三个字）书上记着说：看哪，我要差遣我的使者在你前面，预备道路。

3在旷野有人声喊着说：预备主的道，修直他的路。

4照这话，约翰来了，在旷野施洗，传悔改的洗礼，使罪得赦。

5犹太全地和耶路撒冷的人都出去到约翰那里，承认他们的罪，在约但河里受他的洗。

6约翰穿骆驼毛的衣服，腰束皮带，吃的是蝗虫、野蜜。

7他传道说：有一位在我以後来的，能力比我更大，我就是弯腰给他解鞋带也是不配的。

8我是用水给你们施洗，他却要用圣灵给你们施洗。

9那时，耶稣从加利利的拿撒勒来，在约但河里受了约翰的洗。

10他从水里一上来，就看见天裂开了，圣灵彷佛鸽子，降在他身上。

11又有声音从天上来，说：你是我的爱子，我喜悦你。

12圣灵就把耶稣催到旷野里去。

13他在旷野四十天，受撒但的试探，并与野兽同在一处，且有天使来伺候他。

14约翰下监以後，耶稣来到加利利，宣传神的福音，

15说：日期满了，神的国近了。你们当悔改，信福音！

16耶稣顺着加利利的海边走，看见西门和西门的兄弟安得烈在海里撒网；他们本是打鱼的。

17耶稣对他们说：来跟从我，我要叫你们得人如得鱼一样。

18他们就立刻舍了网，跟从了他。

19耶稣稍往前走，又见西庇太的儿子雅各和雅各的兄弟约翰在船上补网。

20耶稣随即招呼他们，他们就把父亲西庇太和雇工人留在船上，跟从耶稣去了。

21到了迦百农，耶稣就在安息日进了会堂教训人。

22众人很希奇他的教训；因为他教训他们，正像有权柄的人，不像文士。

23在会堂里，有一个人被污鬼附着。他喊叫说：

24拿撒勒人耶稣，我们与你有甚麽相干？你来灭我们麽？我知道你是谁，乃是神的圣者。

25耶稣责备他说：不要作声！从这人身上出来罢。

26污鬼叫那人抽了一阵疯，大声喊叫，就出来了。

27众人都惊讶，以致彼此对问说：这是甚麽事？是个新道理阿！他用权柄吩咐污鬼，连污鬼也听从了他。

28耶稣的名声就传遍了加利利的四方。

29他们一出会堂，就同着雅各、约翰，进了西门和安得烈的家。

30西门的岳母正害热病躺着，就有人告诉耶稣。

31耶稣进前拉着他的手，扶他起来，热就退了，他就服事他们。

32天晚日落的时候，有人带着一切害病的，和被鬼附的，来到耶稣跟前。

33合城的人都聚集在门前。

34耶稣治好了许多害各样病的人，又赶出许多鬼，不许鬼说话，因为鬼认识他。

35次日早晨，天未亮的时候，耶稣起来，到旷野地方去，在那里祷告。

36西门和同伴追了他去，

37遇见了就对他说：众人都找你。

38耶稣对他们说：我们可以往别处去，到邻近的乡村，我也好在那里传道，因为我是为这事出来的。

39於是在加利利全地，进了会堂，传道，赶鬼。

40有一个长大麻疯的来求耶稣，向他跪下，说：你若肯，必能叫我洁净了。

41耶稣动了慈心，就伸手摸他，说：我肯，你洁净了罢！

42大麻疯即时离开他，他就洁净了。

43耶稣严严的嘱咐他，就打发他走，

44对他说：你要谨慎，甚麽话都不可告诉人，只要去把身体给祭司察看，又因为你洁净了，献上摩西所吩咐的礼物，对众人作证据。

45那人出去，倒说许多的话，把这件事传扬开了，叫耶稣以後不得再明明的进城，只好在外边旷野地方。人从各处都就了他来。

