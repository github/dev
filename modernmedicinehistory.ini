西方医学发展的历史时间线可以归纳如下：

### 一、古希腊和罗马时期

* **时代背景**：这一时期是西方医学的萌芽阶段，医学开始从宗教祭祀中独立出来，逐渐成为一个专业化的职业。
* **重要人物**：

	* **希波克拉底**：被誉为“西方医学之父”，他的作品《希波克拉底誓言》至今仍被视为医学伦理的基石。他致力于了解机体的运行机理、器官的内部联系理论、诊断和预后的相关性，以及通过饮食、睡眠和运动来预防疾病等。
	* **伽伯**：被认为是最早的实验医学家之一，开创了以经验为基础的医学研究方法。

### 二、中世纪（公元500年至公元1500年）

* **时代背景**：由于基督教的影响，医学的发展受到了一定程度的限制，但仍有重要著作出现。
* **重要人物与著作**：

	* **阿维尼纳**：《医学典篇》
	* **伊本西那（阿维森纳）**：《医学百科全书》，被誉为“有史以来最著名医学教科书”的作者，预防医学的创始人。

### 三、文艺复兴时期（公元1500年至公元1700年）

* **时代背景**：人们开始重视解剖学和病理学的研究，医学职业迎来了重大的理论革新。
* **重要人物**：

	* **安德烈亚斯·维萨里**：被誉为“现代解剖学之父”，他的著作《人体构造》被视为解剖学研究的里程碑。
	* **伊万·巴洛克**：发明了显微镜，并开创了微生物学研究的先河。

### 四、近代（公元1700年至20世纪初）

* **时代背景**：医学研究的范围和深度都得到了极大的扩展，西方医学发展迅速。
* **重要人物与成就**：

	* **爱德华·詹纳**：医学免疫学的创始人之一，他发现了牛痘和天花之间的联系，发明了首个天花疫苗，并证实了其安全性和有效性。
	* **路易·巴斯德**：发现了分子不对称理论、巴氏灭菌法，开发了狂犬病、霍乱及炭疽疫苗，并成立了巴斯德研究所。
	* **亚历山大·弗莱明**：发现了青霉素，开创了抗生素的使用，对于控制感染病毒有重大的贡献。

### 五、20世纪至今

* **时代背景**：医学成为了一门高度专业化的学科，各个领域的研究也变得越来越深入和精细。
* **重要成就**：

	* 心脏移植、基因工程药物研究等领域的发展极大地推动了医学的进步。
	* 系统生物学和系统医学的研究机构纷纷建立，医学步入了系统医学与药物学的时代。

此外，还有一些其他重要人物和成就，如：

* **威廉·奥斯勒爵士**：现代临床实践之父，他的著作《奥斯勒氏的原则和医学实践》倡导远离课本的临床学习，成为世界各地医生的标准教科书。
* **伊格纳兹·塞梅尔魏斯**：应用统计学的方法建立手术和医疗的卫生条件，发现分娩后的洗手可显著降低死亡率，被人们称为“母亲的救世主”。
* **约瑟夫·李斯特**：无菌手术之父，将微生物理论应用于手术，改变了患者的治疗效果和手术的操作路径。
* **西格蒙德·弗洛伊德**：精神分析学之父，形成了自己的精神分析理论，改变了精神病学和心理学的实践以及西方社会人们的思维和生活方式。

综上所述，西方医学的发展历程中，医学研究的领域和方法不断发展和创新，为人类健康事业做出了巨大贡献。