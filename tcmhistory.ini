中医发展的历史时间线，涵盖了多个重要朝代、杰出人物及其著作，以下是详细的时间线梳理：

### 远古至公元前21世纪（医药起源）

* **原始人**：在采食过程中发掘了一些具有药用价值的植物。
* **氏族公社时期**：发明了火，衍生出熨法和灸法。
* **黄帝与炎帝（神农）**：传说中的中医药始祖。

### 公元前1700年至公元前1100年（早期医药卫生活动）

* **伊尹**：传说他精于烹调，是汤液的发明者。
* **甲骨文**：已有许多病症名称的记载，同时开始有除虫、洗澡、洗脸等卫生知识。

### 公元前1100年至公元前221年（周，医学理论体系初步形成）

* **《周礼》**：记载了食医、疾医、疡医及兽医等医事制度，并有四时流行病和“五毒”之药。
* **医和**：用“六气致病说”来解释各种疾病的成因。
* **扁鹊**：中国第一位正式传记的医家，创立了中医诊断基础。
* **《黄帝内经》**：分为《素问》及《灵枢》二册，是当时医疗实践经验的总结，亦标志中医理论体系的初步形成。
* **《五十二病方》**：现存最早的中药学参考文献，内容显示当时已有中药复方配伍理论。
* **《神农本草经》**：最早期的完整中药学文献，总结了当时的用药经验，共载药物365种，对药性、功能等已有概述。
* **华佗**：开创中药麻醉法（麻沸散），提倡体育疗法（导引除病），创立五禽戏。
* **张仲景**：《伤寒杂病论》确立了“辨证论治”原则，亦即现今流传的《伤寒论》及《金匮要略》。

### 公元220年至581年（三国、魏晋及南北朝，医药学全面发展）

* **王叔和**：《脉经》，现存最早的中医脉学专著，奠立了脉理与方法的系统化、规范化基础。
* **皇甫谧**：《针灸甲乙经》，最早期的完整针灸疗法参考文献。
* **葛洪**：《肘后救卒方》，临床第一部急救手册。
* **雷敩**：《雷公炮炙论》，第一本药物炮制学专著。
* **龚庆宣**：《刘涓子鬼遗方》，现存最早的中医外科专书。
* **陶弘景**：《本草经集注》，共载药物730种，对当时的中药知识作了勘订整理。
* **巢元方**：《诸病源候论》，中国最早的病因证候学记录。

### 公元581年至960年（隋唐，医药学理论和实践进一步发展）

* **唐政府**：设立“太医署”，成立医学教育机构，开始有分科教授医学。
* **苏敬**：《新修本草》，是世界上第一部由国家政府颁行的药典。
* **孙思邈**：《千金要方》、《千金翼方》，中国第一部医学百科全书。
* **孟诜**：《食疗本草》，一本总结食用和治疗的本草专著。
* **陈藏器**：《本草拾遗》，指导临床辨证用药。
* **王焘**：《外台秘要》，为总结性著作。
* **蔺道人**：《理伤续断秘方》，中国现存第一部骨伤科专著。
* **昝殷**：《经效产宝》，现存第一部妇产科专著。

### 公元960年至1279年（宋，医药学突出成就与创新）

* **王怀隐**：《太平圣惠方》，受命于宋政府编辑的大型方书。
* **王惟一**：《铜人腧穴针灸图经》，详述手足三阴三阳经脉及任、督二脉的循行路线和腧穴，并设计制造针灸铜人。
* **掌禹锡**：《嘉佑补注神农本草》，书中记载的药物达1083种。
* **苏颂**：《本草图经》，中国第一部刻版药物图谱。
* **唐慎微**：《证类本草》，个人编著，代表宋代药物学最高成就。
* **宋政府**：设立“校正医书局”，校定古代医书，编写本草、医方，并刊刻印行；设立“太医局”，下设“卖药所”，后改称“医药惠民局”；设“修合药所”，后改称为“医药和剂惠民局”。
* **陈师文**：《太平惠民和剂局方》，宋政府属下药局的成药处方指南，世界上最早的国家药局医方典籍之一。
* **成无己**：《注解伤寒论》，现存全面注解《伤寒论》的最早的注释本。
* **刘昉**：《幼幼新书》，本书整理汇集了宋以前有关儿科学的成就，作者发明小儿指纹观察法。
* **陈言**：《三因极一病证方论》，进一步阐述“三因致病说”。
* **张元素**：《珍珠囊》，对药物归经学说的发展有重要影响。
* **张从正**：《儒门事亲》，提倡“六门三法”。
* **王执中**：《针灸资生经》，首创以因证配穴，来指导临床针灸治疗。

### 公元1368年至1912年（元明清，医药学继续发展）

* **李杲（东垣）**：《脾胃论》，引用了大量的《内经》原文来阐述脾胃论的主要观点和治疗方药。
* **李时珍**：《本草纲目》，明朝医学家李时珍30余年心血的结晶，全书共有190多万字，共五十二卷，收载药物60类，计1892种，附药图1000余幅，并载附方10000余，是几千年来祖国药物学的总结。
* **宋慈**：《洗冤集录》，是世界上第一部系统的法医学著作。
* **叶天士**：清代著名医学家，其著作和学说对中医温病学有着深远影响。
* **吴鞠通**：撰写《温病条辨》，对温病学说进行了系统的阐述和发展。

### 近现代

* **中西医汇通思潮**：清朝末期，随着洋务运动的兴起，中西医汇通思潮开始涌现，一些医家开始尝试将中医与西医相结合。
* **现代中医发展**：自1982年国家《宪法》写入“发展现代医药和我国传统医药”之后，中医得到了更加广泛的发展和应用。现代中医在继承传统理论的基础上，不断吸收现代科学技术成果，推动中医药学的现代化和国际化进程。

以上时间线仅涵盖了中医发展史上的一些重要节点和代表性人物、著作。实际上，中医的发展是一个不断积累、不断创新的过程，涉及的人物和著作远不止这些。