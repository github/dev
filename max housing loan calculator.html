<!DOCTYPE html>
<html>
<head>
    <title>Max Housing Loan Calculator</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input[type="number"], select, button {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            background-color: #28a745;
            color: #fff;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #218838;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            background: #e9ecef;
            border-radius: 5px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Max Housing Loan Calculator (Singapore)</h2>
        <div class="form-group">
            <label for="age">Age:</label>
            <input type="number" id="age" max="65">
        </div>
        <div class="form-group">
            <label for="income">Monthly Income (SGD):</label>
            <input type="number" id="income" step="0.01">
        </div>
        <div class="form-group">
            <label for="loanTenure">Loan Tenure (years, max 25):</label>
            <input type="number" id="loanTenure" max="25">
        </div>
        <div class="form-group">
            <label for="currentDebts">Monthly Debts/Liabilities (SGD):</label>
            <input type="number" id="currentDebts" step="0.01">
        </div>
        <div class="form-group">
            <label for="propertyType">Property Type:</label>
            <select id="propertyType">
                <option value="private">Private Property</option>
                <option value="hdb">HDB Property</option>
            </select>
        </div>
        <div class="form-group">
            <label for="ltvRatio">Loan-to-Value (LTV) Ratio (%):</label>
            <input type="number" id="ltvRatio" step="0.01" value="75">
        </div>
        <div class="form-group">
            <label for="interestRate">Annual Interest Rate (%):</label>
            <input type="number" id="interestRate" step="0.01" value="3.5">
        </div>
        <button onclick="calculateMaxLoan()">Calculate</button>
        <div class="result" id="result"></div>
    </div>
    
    <script>
        function calculateMaxLoan() {
            const age = parseInt(document.getElementById('age').value);
            const income = parseFloat(document.getElementById('income').value);
            const loanTenure = parseInt(document.getElementById('loanTenure').value);
            const currentDebts = parseFloat(document.getElementById('currentDebts').value);
            const propertyType = document.getElementById('propertyType').value;
            const ltvRatio = parseFloat(document.getElementById('ltvRatio').value) / 100;
            const interestRate = parseFloat(document.getElementById('interestRate').value) / 100;
            
            if (isNaN(age) || isNaN(income) || isNaN(loanTenure) || isNaN(currentDebts) || isNaN(ltvRatio) || isNaN(interestRate)) {
                alert("Please enter valid numbers.");
                return;
            }
            
            if (age + loanTenure > 65 || loanTenure > 25) {
                alert("The sum of age and loan tenure must not exceed 65 years, and loan tenure must not exceed 25 years.");
                return;
            }
            
            const maxTDSR = 0.55;
            const maxMSR = 0.30;
            
            let maxMonthlyRepayment = (income * maxTDSR) - currentDebts;
            if (propertyType === "hdb") {
                maxMonthlyRepayment = Math.min(maxMonthlyRepayment, income * maxMSR);
            }
            
            const monthlyInterestRate = interestRate / 12;
            const numberOfPayments = loanTenure * 12;
            
            const maxLoanAmount = maxMonthlyRepayment * ((1 - Math.pow(1 + monthlyInterestRate, -numberOfPayments)) / monthlyInterestRate);
            const maxPropertyValue = maxLoanAmount / ltvRatio;
            const downPaymentRequired = maxPropertyValue * (1 - ltvRatio);
            const monthlyInstallment = (maxLoanAmount * monthlyInterestRate) / (1 - Math.pow(1 + monthlyInterestRate, -numberOfPayments));
            
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `Maximum Loan Amount: SGD ${maxLoanAmount.toFixed(2)}<br>`;
            resultDiv.innerHTML += `Maximum Property Value: SGD ${maxPropertyValue.toFixed(2)}<br>`;
            resultDiv.innerHTML += `Down Payment Required: SGD ${downPaymentRequired.toFixed(2)}<br>`;
            resultDiv.innerHTML += `Monthly Installment: SGD ${monthlyInstallment.toFixed(2)}`;
        }
    </script>
</body>
</html>
