✳每日福音书分享-马太福音

《馬太福音11》
11耶稣吩咐完了十二个门徒，就离开那里，往各城去传道，教训人。

2约翰在监里听见基督所作的事，就打发两个门徒去，

3问他说：那将要来的是你麽？还是我们等候别人呢？

4耶稣回答说：你们去，把所听见，所看见的事告诉约翰。

5就是瞎子看见，瘸子行走，长大麻疯的洁净，聋子听见，死人复活，穷人有福音传给他们。

6凡不因我跌倒的就有福了！

7他们走的时候，耶稣就对众人讲论约翰说：你们从前出到旷野是要看甚麽呢？要看风吹动的芦苇麽？

8你们出去到底是要看甚麽？要看穿细软衣服的人麽？那穿细软衣服的人是在王宫里。

9你们出去究竟是为甚麽？是要看先知麽？我告诉你们，是的，他比先知大多了。

10经上记着说：我要差遣我的使者在你前面预备道路，所说的就是这个人。

11我实在告诉你们，凡妇人所生的，没有一个兴起来大过施洗约翰的；然而天国里最小的比他还大。

12从施洗约翰的时候到如今，天国是努力进入的，努力的人就得着了。

13因为众先知和律法说预言，到约翰为止。

14你们若肯领受，这人就是那应当来的以利亚。

15有耳可听的，就应当听！

16我可用甚麽比这世代呢？好像孩童坐在街市上招呼同伴，说：

17我们向你们吹笛，你们不跳舞；我们向你们举哀，你们不捶胸。

18约翰来了，也不吃也不喝，人就说他是被鬼附着的；

19人子来了，也吃也喝，人又说他是贪食好酒的人，是税吏和罪人的朋友。但智慧之子总以智慧为是（有古卷：但智慧在行为上就显为是）。

20耶稣在诸城中行了许多异能，那些城的人终不悔改，就在那时候责备他们，说：

21哥拉汛哪，你有祸了！伯赛大阿，你有祸了！因为在你们中间所行的异能，若行在推罗、西顿，他们早已披麻蒙灰悔改了。

22但我告诉你们，当审判的日子，推罗、西顿所受的，比你们还容易受呢！

23迦百农阿，你已经升到天上（或作：你将要升到天上麽），将来必坠落阴间；因为在你那里所行的异能，若行在所多玛，他还可以存到今日。

24但我告诉你们，当审判的日子，所多玛所受的，比你还容易受呢！

25那时，耶稣说：父阿，天地的主，我感谢你！因为你将这些事向聪明通达人就藏起来，向婴孩就显出来。

26父阿，是的，因为你的美意本是如此。

27一切所有的，都是我父交付我的；除了父，没有人知道子；除了子和子所愿意指示的，没有人知道父。

28凡劳苦担重担的人可以到我这里来，我就使你们得安息。

29我心里柔和谦卑，你们当负我的轭，学我的样式；这样，你们心里就必得享安息。

30因为我的轭是容易的，我的担子是轻省的。

