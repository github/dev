✳每日福音书分享-马太福音

《馬太福音16》
1法利赛人和撒都该人来试探耶稣，请他从天上显个神迹给他们看。

2耶稣回答说：晚上天发红，你们就说：天必要晴。

3早晨天发红，又发黑，你们就说：今日必有风雨。你们知道分辨天上的气色，倒不能分辨这时候的神迹。

4一个邪恶淫乱的世代求神迹，除了约拿的神迹以外，再没有神迹给他看。耶稣就离开他们去了。

5门徒渡到那边去，忘了带饼。

6耶稣对他们说：你们要谨慎，防备法利赛人和撒都该人的酵。

7门徒彼此议论说：这是因为我们没有带饼罢。

8耶稣看出来，就说：你们这小信的人，为甚麽因为没有饼彼此议论呢？

9你们还不明白麽？不记得那五个饼分给五千人、又收拾了多少篮子的零碎麽？

10也不记得那七个饼分给四千人、又收拾了多少筐子的零碎麽？

11我对你们说：要防备法利赛人和撒都该人的酵，这话不是指着饼说的，你们怎麽不明白呢？

12门徒这才晓得他说的不是叫他们防备饼的酵，乃是防备法利赛人和撒都该人的教训。

13耶稣到了该撒利亚腓立比的境内，就问门徒说：人说我（有古卷没有我字）人子是谁？

14他们说：有人说是施洗的约翰；有人说是以利亚；又有人说是耶利米或是先知里的一位。

15耶稣说：你们说我是谁？

16西门彼得回答说：你是基督，是永生神的儿子。

17耶稣对他说：西门巴约拿，你是有福的！因为这不是属血肉的指示你的，乃是我在天上的父指示的。

18我还告诉你，你是彼得，我要把我的教会建造在这磐石上；阴间的权柄（权柄：原文是门），不能胜过他。

19我要把天国的钥匙给你，凡你在地上所捆绑的，在天上也要捆绑；凡你在地上所释放的，在天上也要释放。

20当下，耶稣嘱咐门徒，不可对人说他是基督。

21从此，耶稣才指示门徒，他必须上耶路撒冷去，受长老、祭司长、文士许多的苦，并且被杀，第三日复活。

22彼得就拉着他，劝他说：主阿，万不可如此！这事必不临到你身上。

23耶稣转过来，对彼得说：撒但，退我後边去罢！你是绊我脚的；因为你不体贴神的意思，只体贴人的意思。

24於是耶稣对门徒说：若有人要跟从我，就当舍己，背起他的十字架来跟从我。

25因为，凡要救自己生命（生命：或作灵魂；下同）的，必丧掉生命；凡为我丧掉生命的，必得着生命。

26人若赚得全世界，赔上自己的生命，有甚麽益处呢？人还能拿甚麽换生命呢？

27人子要在他父的荣耀里，同着众使者降临；那时候，他要照各人的行为报应各人。

28我实在告诉你们，站在这里的，有人在没尝死味以前必看见人子降临在他的国里。

